name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - dev  # Set this to your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Set this to the Python version you use

    - name: Install dependencies
      run: |
        pip install awsebcli
        pip install -r requirements.txt

    - name: Deploy to AWS Elastic Beanstalk
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: 'us-east-2'  # Set your AWS region
      run: |
        eb init -p python-3.11 OneNodeBrain --region $AWS_REGION
        eb use OneNodeBrain-env-dev
        eb deploy
