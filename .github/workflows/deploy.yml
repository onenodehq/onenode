name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
      - dev # Set this to your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Set this to the Python version you use

      - name: Install dependencies
        run: |
          pip install awsebcli
          pip install -r requirements.txt

      # Deploy to capybaradb-env when branch is main
      - name: Deploy to AWS Elastic Beanstalk (capybaradb-env)
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-2"
        run: |
          eb init -p python-3.12 capybaradb-app --region $AWS_REGION
          eb use capybaradb-env
          eb deploy

      # Deploy to capybaradb-beat when branch is main
      - name: Deploy to AWS Elastic Beanstalk (capybaradb-beat)
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-2"
        run: |
          eb init -p python-3.12 capybaradb-app --region $AWS_REGION
          eb use capybaradb-beat
          eb deploy

      # Deploy to capybaradb-env-dev when branch is dev
      - name: Deploy to AWS Elastic Beanstalk (capybaradb-env-dev)
        if: github.ref == 'refs/heads/dev'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-2"
        run: |
          eb init -p python-3.12 OneNodeBrain --region $AWS_REGION
          eb use capybaradb-env-dev
          eb deploy
