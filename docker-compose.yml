version: '3.8'

services:
  web:
    build: .
    container_name: onenode-web
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MONGO_CLIENT_URI=mongodb://root:rootpassword@mongodb:27017/
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - .:/app
    depends_on:
      - redis
      - minio
      - mongodb
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "4", "application:application"]

  celery-worker:
    build: .
    container_name: onenode-celery-worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MONGO_CLIENT_URI=mongodb://root:rootpassword@mongodb:27017/
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - .:/app
    depends_on:
      - redis
      - minio
      - mongodb
    command: ["celery", "-A", "celery_setup", "worker", "--loglevel=info"]



  redis:
    image: redis:7-alpine
    container_name: onenode-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: onenode-minio
    ports:
      - "9000:9000"    # MinIO API
      - "9001:9001"    # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mongodb:
    image: mongo:7.0
    container_name: onenode-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: onenode
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  minio_data:
    driver: local
  mongodb_data:
    driver: local
